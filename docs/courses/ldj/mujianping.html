/* ═══════════════ 3D HERO ═══════════════ */
.hero-3d-container{

}
.hero-3d-container canvas{display:block}
.hero-3d-overlay{

}
.hero-3d-overlay .char-name{

.timeline{

}
.timeline::before{

  width:1px;background:var(--border2);
}
.timeline-item{
  position:relative;margin-bottom:28px;
}
.timeline-item::before{
  content:'';position:absolute;left:-28px;top:4px;
  width:10px;height:10px;border-radius:50%;
  background:#d0c0e0;border:2px solid var(--bg);
}
.timeline-item .tl-year{

.tag.gold{background:rgba(208,192,224, .1);color:#d0c0e0}
